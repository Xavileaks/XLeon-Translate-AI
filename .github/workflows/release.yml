name: Publicar plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar PHP y comportamiento
        run: |
          set -euo pipefail
          version=$(sed -n 's/ \* Version: //p' xleon-translate-ai.php)
          test "$version" = "${GITHUB_REF_NAME#v}"
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
      - name: Crear ZIP
        run: |
          mkdir -p build/xleon-translate-ai
          cp xleon-translate-ai.php README.md readme.txt LICENSE build/xleon-translate-ai/
          cp -r includes assets build/xleon-translate-ai/
          cd build
          zip -r xleon-translate-ai.zip xleon-translate-ai
          sha256sum xleon-translate-ai.zip > xleon-translate-ai.zip.sha256
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/xleon-translate-ai.zip build/xleon-translate-ai.zip.sha256 --title "XLeon Translate AI $GITHUB_REF_NAME" --generate-notes
